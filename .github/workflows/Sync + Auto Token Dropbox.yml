name: Sync Dropbox Face Library

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout Repository
      - name: 📥 Checkout
        uses: actions/checkout@v4

      # Setup Python
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install Dependencies
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install dropbox

      # Run Script
      - name: 🚀 Run Script
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: |
          python generate_json.py

      # Commit & Push
      - name: 💾 Commit JSON
        run: |
          git config --global user.name "gamenex-bot"
          git config --global user.email "bot@gamenex.com"

          git add facelibrary18.json

          git status

          git diff --cached --quiet && echo "No changes detected" || git commit -m "auto sync dropbox"

          git push
