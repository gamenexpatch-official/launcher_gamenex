name: Sync Dropbox Face Library

on:
  schedule:
    - cron: "*/30 * * * *"   # ⏱️ tiap 30 menit
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v3

      - name: 📦 Install dependencies
        run: pip install dropbox

      - name: 🚀 Run Script
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
        run: python generate_json.py

      - name: 💾 Commit JSON
        run: |
          git config user.name "aasobb"
          git config user.email "Gamenex@github.com"
          git add facelibrary18.json
          git commit -m "auto sync dropbox" || echo "no changes"
          git push
